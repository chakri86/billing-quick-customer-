name: Signed Play Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QC_UPLOAD_KEYSTORE_BASE64: ${{ secrets.QC_UPLOAD_KEYSTORE_BASE64 }}
      QC_STORE_PASSWORD: ${{ secrets.QC_STORE_PASSWORD }}
      QC_KEY_ALIAS: ${{ secrets.QC_KEY_ALIAS }}
      QC_KEY_PASSWORD: ${{ secrets.QC_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release secrets
        run: |
          test -n "$QC_UPLOAD_KEYSTORE_BASE64"
          test -n "$QC_STORE_PASSWORD"
          test -n "$QC_KEY_ALIAS"
          test -n "$QC_KEY_PASSWORD"

      - name: Configure upload signing key
        run: |
          echo "$QC_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quick-customer-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/quick-customer-upload.jks"
            echo "storePassword=$QC_STORE_PASSWORD"
            echo "keyAlias=$QC_KEY_ALIAS"
            echo "keyPassword=$QC_KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build signed bundle
        run: ./gradlew testDebugUnitTest bundleRelease

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: quick-customer-v0.7.0-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
